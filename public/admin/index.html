<style>
:root{
  --paper:#F6F7FB; --sheet:#FFFFFF; --ink:#001536; --text:#1F2B45; --muted:#56627A; --faint:#8692A8;
  --rule:#DCE1EA; --rule-strong:#C1C9D8; --blue:#014FE5; --sky:#5C9BFF; --wash:#E8F0FF;
  --pass:#12804F; --passw:#E3F3EA; --warn:#AD5F08; --warnw:#FBF0DF; --fail:#C2341F; --failw:#FBE7E3;
  --navy:#001536;
  --sans:"Overpass","Helvetica Neue",Arial,system-ui,sans-serif; --serif:"Bitter",Georgia,serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.5;}
a{color:var(--blue);}
.top{background:var(--navy);color:#fff;}
.top .in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;}
.top img{height:46px;display:block;}
.top .t{font-weight:700;color:#A9B8D6;font-size:.95rem;}
.top nav{margin-left:auto;display:flex;gap:10px;}
.top button{font:inherit;font-weight:600;font-size:.9rem;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 12px;cursor:pointer;}
main{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
h1{font-weight:800;font-size:1.9rem;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px;}
h2{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px;}
h3{font-weight:700;font-size:1.02rem;color:var(--ink);margin:18px 0 6px;}
.sub{color:var(--muted);margin:0 0 16px;}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;margin:0 0 18px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;}
label{display:block;font-weight:600;font-size:.86rem;color:var(--ink);margin-bottom:4px;}
label small{font-weight:400;color:var(--muted);}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;font-size:.95rem;color:var(--text);background:#fff;border:1px solid var(--rule-strong);border-radius:6px;padding:8px 10px;}
textarea{min-height:80px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--blue);}
a.btn{text-decoration:none;display:inline-block;}
.btn{font:inherit;font-weight:700;font-size:.95rem;border-radius:6px;padding:9px 16px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;}
.btn.quiet{background:#fff;color:var(--ink);border-color:var(--rule-strong);}
.btn.danger{background:#fff;color:var(--fail);border-color:var(--fail);}
.btn[disabled]{opacity:.5;cursor:default;}
.err{color:var(--fail);font-weight:600;}
.muted{color:var(--muted);} .small{font-size:.86rem;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:.8rem;font-weight:700;color:var(--muted);padding:6px 10px 6px 0;border-bottom:2px solid var(--ink);}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);}
.list-item:first-child{border-top:0;}
.card.leads{border:2px solid var(--blue);}
.sugg{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--rule);font-weight:400;margin:0;cursor:pointer;}
.sugg input{margin-top:4px;width:16px;height:16px;}
.plan-row{display:grid;grid-template-columns:2fr 140px 170px auto;gap:8px;padding:10px 0;border-top:1px solid var(--rule);align-items:center;}
.plan-row textarea{grid-column:1 / -1;min-height:52px;}
.goals-ed{grid-column:1 / -1;border:1px dashed var(--rule-strong);border-radius:8px;padding:8px 12px;}
.goals-ed summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--blue);}
.goal-row{display:grid;grid-template-columns:260px 1fr;gap:10px;align-items:center;margin:6px 0;}
.extra-row{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 120px auto;gap:6px;margin:6px 0;}
.extra-row .btn{padding:6px 10px;font-size:.84rem;}
.goal-row > *,.extra-row > *{min-width:0;width:100%;box-sizing:border-box;}
.plan-row > *{min-width:0;}
.goals-ed{min-width:0;overflow:hidden;}
.extra-row .btn{width:auto;}
@media (max-width:760px){ .goal-row,.extra-row{grid-template-columns:1fr;} }
.checks-list{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;background:var(--wash);border-radius:8px;padding:8px 12px;}
.chk-item{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem;}
.btn.tiny{padding:3px 9px;font-size:.8rem;}
.plan-kind{grid-column:1 / -1;display:flex;align-items:center;gap:6px;margin:0;font-weight:500;}
.plan-kind select{width:auto;padding:4px 8px;font-size:.86rem;}
.plan-row .btn{padding:7px 12px;font-size:.86rem;}
@media (max-width:760px){ .plan-row{grid-template-columns:1fr 1fr;} }
.list-item .row .btn{white-space:nowrap;}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;}
.p-pass{background:var(--passw);color:var(--pass);} .p-warn{background:var(--warnw);color:var(--warn);} .p-fail{background:var(--failw);color:var(--fail);} .p-info{background:var(--wash);color:var(--blue);}
.prog{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--blue);}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.sc{border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:center;background:#fff;}
.sc.you{border:2px solid var(--blue);}
.sc .lab{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.04em;}
.sc .big{font-weight:800;font-size:2.6rem;line-height:1;color:var(--ink);margin:8px 0 4px;}
.sc.you .big{color:var(--blue);}
.sc .ci{font-size:.84rem;color:var(--muted);}
.sc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;text-align:left;font-size:.86rem;margin:12px 0 0;}
.sc dt{color:var(--faint);} .sc dd{margin:0;font-weight:600;color:var(--ink);}
.heat{display:inline-block;min-width:46px;text-align:center;font-weight:700;font-size:.86rem;padding:3px 6px;border-radius:4px;}
.bar{position:relative;height:14px;background:var(--rule);border-radius:3px;min-width:120px;}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px;}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);}
.excerpt{font-family:var(--serif);font-size:.92rem;background:var(--paper);border-left:3px solid var(--rule-strong);padding:8px 12px;margin:6px 0 12px;}
.note{font-family:var(--serif);color:var(--muted);font-size:.9rem;}
.card.rk-open{border:2px solid var(--blue);}
.rk-set{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px;}
.rk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--rule);}
.rk-row b{color:var(--ink);}
.rk-row .row{justify-content:flex-end;}
.rk-row .prog{margin-top:6px;max-width:320px;}
.rk-h{font-size:.8rem;font-weight:700;color:var(--muted);margin:18px 0 0;padding-bottom:4px;border-bottom:2px solid var(--ink);}
.rk-row.past{padding:8px 0;font-size:.92rem;}
@media (max-width:760px){ .rk-row{grid-template-columns:1fr;} .rk-row .row{justify-content:flex-start;} }
.ou-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px;}
.ou-grid h3{margin-top:0;}
.ou-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0;}
.ou-row label{margin:0;display:flex;gap:6px;align-items:center;font-weight:600;}
.ou-row input[type=checkbox]{width:16px;height:16px;}
.ou-log{margin-top:14px;}
.ou-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:9px 0;border-top:1px solid var(--rule);font-size:.9rem;}
.ou-item pre{grid-column:1 / -1;white-space:pre-wrap;font-family:var(--serif);font-size:.86rem;background:var(--paper);border-radius:6px;padding:8px 10px;margin:0;}
@media (max-width:760px){ .ou-grid{grid-template-columns:1fr;} }
.tabs{display:flex;gap:6px;margin:0 0 14px;}
@media (max-width:760px){ .grid2,.grid3{grid-template-columns:1fr;} .top .t{display:none;} }
@media print{
  .top,.noprint{display:none !important;}
  body{background:#fff;font-size:11pt;}
  main{padding:0;max-width:none;}
  .card{border:0;padding:0 0 12px;margin:0 0 14px;page-break-inside:avoid;}
  .card.report-section{border-top:1px solid #ccc;padding-top:10px;}
}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const main = () => $("#main");
const mount = (...nodes) => main().replaceChildren(...nodes.flat().filter(Boolean));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const areaLabel = (r) => (Number(r) >= 400 ? "all of Maine" : `${r}-mile area`);
const pct = (x) => (x == null ? "–" : Math.round(x * 100) + "%");
const range = (o) => (o && o.n ? `likely ${Math.round(o.low * 100)}–${Math.round(o.high * 100)}%` : "no data");
const dt = (s) => (s ? new Date(s).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "");
const heatColor = (r) => (r == null ? "#eef1f6" : r >= 0.6 ? "#cfe9da" : r >= 0.35 ? "#e3edff" : r >= 0.15 ? "#fbf0df" : "#fbe7e3");

/* ---------- API ---------- */
const KEYNAME = "207-admin-key";
let adminKey = "";
try { adminKey = sessionStorage.getItem(KEYNAME) || ""; } catch {}
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-admin-key": adminKey, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Please sign in again."); }
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}
function logout() { adminKey = ""; try { sessionStorage.removeItem(KEYNAME); } catch {} location.hash = "#login"; route(); }
let CONFIG = null;

/* ---------- Router ---------- */
let pollTimer = null;
async function route() {
  clearTimeout(pollTimer);
  const hash = location.hash.replace(/^#/, "") || "clients";
  const [view, arg] = [hash.split("/")[0], decodeURIComponent(hash.split("/").slice(1).join("/"))];
  $("#nav").hidden = !adminKey;
  if (!adminKey || view === "login") return renderLogin();
  try {
    if (!CONFIG) CONFIG = await api("/api/config");
    if (view === "client") return await renderClient(arg);
    if (view === "edit") return await renderEdit(arg);
    if (view === "audit") return await renderAudit(arg);
    return await renderClients();
  } catch (e) {
    mount(h("div", { class: "card" }, h("p", { class: "err", text: e.message })));
  }
}
addEventListener("hashchange", route);

/* ---------- Login ---------- */
function renderLogin() {
  const pw = h("input", { type: "password", id: "pw", autocomplete: "current-password" });
  const err = h("p", { class: "err" });
  const go = async () => {
    adminKey = pw.value;
    try { CONFIG = await api("/api/config"); try { sessionStorage.setItem(KEYNAME, adminKey); } catch {} location.hash = "#clients"; route(); }
    catch (e) { adminKey = ""; err.textContent = e.message; }
  };
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  mount(h("div", { class: "card", style: "max-width:420px;margin:40px auto" },
    h("h1", { text: "Audit console" }), h("p", { class: "sub", text: "For 207 Visibility staff. Enter the admin password set in Netlify." }),
    h("label", { for: "pw", text: "Admin password" }), pw, h("div", { style: "margin-top:14px" }, h("button", { class: "btn", onclick: go, text: "Sign in" })), err));

}

/* ---------- Client form ---------- */
function parseSnapshot(txt) {
  const out = {};
  const name = txt.match(/AI VISIBILITY SNAPSHOT:\s*(.+)/i); if (name) out.business = name[1].trim();
  const tg = txt.match(/^Target towns:\s*(.+)$/im); if (tg && !/none given/i.test(tg[1])) out.testTowns = tg[1].trim();
  const loc = txt.match(/^\s*(.+?)\s+in\s+(.+?),\s*([A-Z]{2}),\s*(?:covering about\s+(\d+)\s+miles|serving all of Maine)/im);
  if (loc) { out.trade = loc[1].trim(); out.town = loc[2].trim(); out.state = loc[3]; out.radius = loc[4] || "400"; }
  const web = txt.match(/^Website:\s*(.+)$/im); if (web && !/none|not given/i.test(web[1])) out.website = web[1].trim();
  const comp = txt.match(/^Competitors to compare:\s*(.+)$/im);
  if (comp && !/none given/i.test(comp[1])) out.competitors = comp[1].split(";").map((s) => { const [n, t] = s.split(",").map((x) => (x || "").trim()); return `${n} | ${t || ""}`; }).join("\n");
  return out;
}

function stepKey(p) {
  const t = String(p.title || "").trim().toLowerCase();
  for (const [re, k] of STEP_PATTERNS) if (re.test(t)) return k;
  return "title:" + t;

const stepKeys = (p) => (p.keys && p.keys.length ? p.keys : [stepKey(p)]);

  // 2. Wrong details, and whether AI knows who you are
  const ph = s.accuracy?.phoneIssues || [], bn = s.accuracy?.brandedNamed;
  const engsP = [...new Set(ph.map((x) => ENG_SHORT[x.engine] || x.engine))], nums = [...new Set(ph.flatMap((x) => x.phones || []))].slice(0, 3).map((d) => d.replace(/(\d{3})(\d{3})(\d{4})/, "($1) $2-$3"));
  const nPh = s.accuracy?.phoneIssueCount || ph.length, onFile = fmtPhone(s.accuracy?.factsPhone);
  const instead = !onFile ? "" : s.accuracy?.phoneSource === "google" ? ` instead of ${onFile}, the number on your Google listing` : ` instead of your number, ${onFile}`;
  const phoneTxt = ph.length ? `In ${nPh} answer${nPh === 1 ? "" : "s"}, AI gave out ${nums.length ? list(nums) : "a different number"}${instead}. A customer who calls a wrong number never reaches you.` : "";
  const nameTxt = bn?.n && bn.rate < 0.9 ? `Asked about ${biz} by name, AI recognized you in only ${ofN(bn)} answers.` : "";
  if (phoneTxt && nameTxt) add({ keys: ["accuracy"], how: HOW.phone, title: "Fix the wrong phone number and make your details match everywhere", when: "This week", type: "accuracy",
    detail: `${phoneTxt} ${nameTxt} Both come from listings that disagree about your name, address or phone.` });
  else if (phoneTxt) add({ keys: ["accuracy"], how: HOW.phone, title: "Fix the wrong phone number AI is giving out", when: "This week", type: "accuracy",
    detail: phoneTxt });
  else if (nameTxt) add({ keys: ["accuracy"], how: HOW.match, title: "Make sure AI knows exactly who you are", when: "This week", type: "accuracy",
    detail: `${nameTxt} That usually means your name, address and phone differ from one listing to the next, so AI isn’t sure which business is you.` });

  // The platform where they're weakest. Rather than a step of its own (which would repeat the
  // listings, reviews, or pages steps), it's called out inside the step that moves it.
  const engs = Object.entries(you.byEngine || {}).filter(([, r]) => r?.n).sort((a, b) => a[1].rate - b[1].rate);
  const [weak, wr] = engs[0] || [];
  let W = null, weakTxt = "";
  if (weak && engs.length > 1 && (wr.rate === 0 || wr.rate < (yr.rate || 0) * 0.5)) {
    const lb = leaderBy("byEngine", weak);
    weakTxt = `${ENG_SHORT[weak]} is your weakest platform: it named you in ${ofN(wr)} answers${lb && lb.r.rate > wr.rate ? ` and ${lb.e.name} in ${lb.r.k}` : ""}.`;
    W = {
      openai: { home: "core", note: "ChatGPT leans on Bing and Yelp and can’t see your Google reviews, so those two matter most for it.", how: "Submit your website at bing.com/webmasters. It’s free, and it helps ChatGPT find your pages.", extra: [track("Bing Webmaster Tools", "Site submitted and indexed")] },
      gemini: { home: "core", note: "Gemini answers from your Google profile: categories, services, hours, photos and reviews.", how: "On Google, fill in every service and category, and add recent photos until you have 20 or more.", extra: [track("Google Maps photos", "20+ recent photos")] },
      aimode: { home: "core", note: "Google’s AI Mode leans on your Google profile and your Google reviews.", extra: [] },
      anthropic: { home: "core", note: "Claude reads the directories it finds, and it tends to leave out a business whose details disagree.", extra: [] },
      perplexity: { home: "pages", note: "Perplexity quotes businesses’ own web pages more than any other assistant." }
    }[weak] || null;
  }

  // 3. The core profiles every assistant reads
  const gem = you.byEngine?.gemini, gpt = you.byEngine?.openai, core = W?.home === "core";
  add({ keys: ["core-listings"], how: core && W.how ? [...HOW.core.slice(0, -1), W.how, HOW.core[HOW.core.length - 1]] : HOW.core, title: "Claim and complete your Google, Bing, Apple and Yelp listings", when: "This week", type: "listings",
    detail: `${core ? `${weakTxt} ${W.note} ` : ""}AI gets its facts about you from these four: Google’s AI and Gemini read your Google profile, ChatGPT leans on Bing and Yelp, and Siri uses Apple Maps.`,
    extra: [track("Google Business Profile", "Claimed and complete, with photos and hours"), track("Bing Places", "Claimed and matching Google"), track("Apple Business Connect", "Claimed and matching Google"), track("Yelp", "Claimed and complete"), ...(core ? W.extra : [])] });

  // 4. The sites AI cites most for this kind of business
  const covered = /google|bing|apple|yelp/;
  const top = s.sources.filter((x) => x.domain !== site?.domain && x.domain !== "google maps" && !covered.test(x.domain)).slice(0, 3);
  if (top.length) add({ keys: ["cited-sites"], how: HOW.cited, title: `Get listed and accurate on ${list(top.map((x) => siteName(x.domain)))}`, when: "This month", type: "listings",
    detail: `When customers asked about ${trades} near you, AI cited ${list(top.map((x, i) => `${siteName(x.domain)} in ${pct(x.share)}${i ? "" : " of answers"}`))}. Businesses listed on these sites, with matching details, are the ones it names.`,
    extra: top.map((x) => track(siteName(x.domain), "Listed, details match")) });

  // 6. Towns: missing from the website, or where competitors win
  const missingF = f("Some towns you serve"), missing = missingF ? String(missingF.detail || "").split(/,\s*/).filter(Boolean) : [];
  const weakTowns = (s.locations || []).slice(1).filter((t) => { const r = you.byLocation?.[t], lb = leaderBy("byLocation", t); return r?.n && (r.rate < 0.15 || (lb && ahead(lb.r, r))); });
  const townList = [...new Set([...missing, ...weakTowns])].slice(0, 3);
  const townStep = !townList.length ? null : add({ keys: ["towns"], how: HOW.towns(townList), title: `Add pages for ${list(townList)}`, when: "This month", type: "towns",
    detail: townList.map((t) => { const r = you.byLocation?.[t], lb = leaderBy("byLocation", t); return r?.n ? `In ${t}, AI named you in ${ofN(r)} answers${lb && lb.r.rate > r.rate ? ` and ${lb.e.name} in ${lb.r.k}` : ""}.` : ""; }).filter(Boolean).join(" ") +
      (townList.some((t) => missing.includes(t)) ? ` Your website doesn’t mention ${list(townList.filter((t) => missing.includes(t))).replace(/ and (?!.* and )/, " or ")} yet.` : "") +
      " AI quotes pages that name the town and the work, so a page per town gives it something of yours to cite." });

  // 7. The kinds of questions where they're weakest
  const food = (s.questions || []).some((q) => q.id === "crave1");
  const em = /plumb|hvac|heat|air|electric|insulat|solar|energy|weather/.test(tradeWord);
  const G = {
    "Need it now": ["Make your emergency and same-day service plain", "hours", "AI only recommends you for urgent jobs if your website and listings say you take them, in those words."],
    "Right now": ["Make sure AI knows when you’re open", "hours", "“Open now” answers come from the hours AI can read on your website and listings."],
    "A specific job": ["Add a page for each job you want more of", "towns", "AI quotes pages that name the job, so a page per service gives it something of yours to cite."],
    "A specific craving": ["Name the dishes people ask about", "towns", "AI repeats what menus and reviews say in plain words, and it can’t read a menu that’s only a PDF or a photo."],
    "Price and trust": ["Publish price ranges and what affects the cost", "other", "AI tends to recommend businesses that answer the price question on their own website."],
    "Plans and logistics": ["Answer the planning questions: parking, kids, reservations", "other", "Diners ask AI about parking, kids and reservations, and it answers from what your website and listings say."],
    "Only in Maine": em ? ["Get listed on Efficiency Maine’s vendor locator", "listings", "Efficiency Maine’s list of registered vendors is the state’s own directory for rebate-eligible work, and AI cites it for these questions."]
      : ["Answer the Maine questions on your site", "towns", "Maine-specific questions go to businesses whose pages answer them."],
    "Anywhere in Maine": ["Build your statewide reputation", "press", "Statewide questions go to the businesses with the most reviews, press and listings across Maine."]
  };
  const gaps = Object.entries(you.byGroup || {}).filter(([g, r]) => G[g] && r?.n).map(([g, r]) => { const lb = leaderBy("byGroup", g); return { g, r, lb, gap: (lb ? lb.r.rate : 0.3) - r.rate }; })
    .filter((x) => x.r.rate < 0.25 || (x.lb && ahead(x.lb.r, x.r))).sort((a, b) => b.gap - a.gap);
  // Up to three steps from the weakest kinds of questions; ones folded into another step don't count.
  let hoursStep = null, pagesStep = null, trust = null, own = 0;
  const used = [];
  const PAGES = { "A specific job": "AI quotes pages that name the job, so a page per service gives it something of yours to cite.",
    "Only in Maine": "Seasonal and Maine-specific questions go to businesses whose pages answer them." };
  // Merges into a step already in the plan are always made; a new step only while there are fewer than three.
  for (const x of gaps) {
    let [title, type, why] = G[x.g], q = qFor(x.g);
    // "Most trusted" is won by reputation (reviews, years, third-party praise), not a price page:
    // it's folded into the reviews or press step below, whichever exists.
    if (x.g === "Price and trust") {
      const by = (id) => { const qq = s.questions.find((z) => z.group === x.g && z.id === id); return qq ? { q: qq, r: you.byQuestion?.[id], lb: leaderBy("byQuestion", id) } : null; };
      const t = by("trusted"), pr = by("price");
      if (t?.r?.n && (!pr?.r?.n || t.r.rate <= pr.r.rate)) {
        used.push(x);
        trust = { key: "group:" + x.g, short: `Reviews also decide “most trusted” questions, where AI named you in ${ofN(t.r)} answers.`,
          text: `For “${t.q.text}”, AI named you in ${ofN(t.r)} answers${t.lb && t.lb.r.rate > t.r.rate ? ` and ${t.lb.e.name} in ${t.lb.r.k}` : ""}. Those answers go to the businesses with the most reviews, years in business and outside praise.` };
        continue;
      }
      if (pr) q = pr.q.text;
    }
    const found = `For questions like “${q}”, AI named you in ${ofN(x.r)} answers${x.lb && x.lb.r.rate > x.r.rate ? ` and ${x.lb.e.name} in ${x.lb.r.k}` : ""}.`;
    const also = ` It’s the same for questions like “${q}”: ${ofN(x.r)} answers.`;
    // Pages for the jobs customers ask about, including the Maine-specific ones, are one step
    // (the town pages are their own step).
    if (PAGES[x.g] && type === "towns") {
      if (pagesStep) {
        used.push(x);
        pagesStep.detail += also;
        pagesStep.keys.push("group:" + x.g); continue;
      }
      if (own >= 3) continue;
      used.push(x);
      pagesStep = add({ keys: ["group:" + x.g], how: HOW.jobs, title: "Add a page for each job customers ask about", type: "towns", when: "This month", detail: `${found} ${PAGES[x.g]}` });
      own++; continue;
    }
    // Emergency service and opening hours are one fix: say it plainly, everywhere.
    if (type === "hours" && hoursStep) {
      used.push(x);
      hoursStep.title = "Make your hours and emergency service plain everywhere";
      hoursStep.detail += also;
      hoursStep.keys.push("group:" + x.g); continue;
    }
    if (own >= 3) continue;
    used.push(x);
    const hoursToo = type === "hours" && f("Hours not found") ? " Your hours aren’t on your website yet." : "";
    const GH = { "Need it now": HOW.hours, "Right now": HOW.hours, "A specific craving": HOW.menu, "Price and trust": HOW.price, "Plans and logistics": HOW.logistics, "Only in Maine": em ? HOW.emaine : HOW.jobs, "Anywhere in Maine": HOW.state };
    const st = add({ keys: ["group:" + x.g], how: GH[x.g] || [], title, type, when: "This month", detail: `${found} ${why}${hoursToo}` });
    own++;
    if (type === "hours") hoursStep = st;
  }
  // Perplexity, if it's the weakest platform, is moved by pages of their own.
  if (W?.home === "pages") {
    const pages = steps.find((x) => x.type === "towns");
    if (pages) pages.detail += ` Your own pages matter most on ${ENG_SHORT[weak]}, your weakest platform (${ofN(wr)} answers).`;
    else add({ keys: ["pages-perplexity"], how: HOW.perplexity, title: "Give Perplexity pages of yours to quote", type: "towns", when: "This month",
      detail: `${weakTxt} Perplexity quotes businesses’ own web pages more than any other assistant, so a clear page for each service and town gives it something of yours.` });
  }

  // 8. Website housekeeping
  if (f("Hours not found") && !used.some((x) => G[x.g][1] === "hours")) add({ keys: ["hours"], how: HOW.hours, title: "Publish your hours everywhere", when: "This week", type: "hours",
    detail: "AI answers “who’s open now?” from the hours it can read, and it couldn’t find yours on your website." });
  const tune = [f("No business schema") && "add business details in the format AI reads (schema markup)", f("Some schema markup is broken") && "repair broken schema markup",
    f("Phone number not found") && "put your phone number in plain text", f("Missing page title") && "add a page title", f("Missing meta description") && "add a page description for search results",
    f("No sitemap") && "add a sitemap so new pages get found"].filter(Boolean);
  if (tune.length) add({ keys: ["tune"], how: HOW.tune, title: "Tune up your website for AI", when: "This month", type: tune.length === 1 && f("No business schema") ? "schema" : "website",
    detail: `Small fixes that help AI read your details correctly: ${list(tune)}. None of them changes how your site looks.` });

  // 9. Reviews against the leader
  const mine = places.client || {}, lrev = comps.map((e) => ({ e, p: places[e.id] })).filter((x) => x.p?.reviews != null).sort((a, b) => b.p.reviews - a.p.reviews)[0];
  const behind = mine.reviews == null || (lrev && mine.reviews < lrev.p.reviews * 0.8) || mine.reviews < 50 || (mine.rating != null && mine.rating < 4.6);
  if (behind) {
    // A goal he can actually reach in four months: about 10 new reviews a month, never past 80% of the leader.
    const target = Math.max((mine.reviews || 0) + 15, Math.min((mine.reviews || 0) + 40, lrev ? Math.round(lrev.p.reviews * 0.8) : 50));
    const by = new Date(Date.now() + 120 * 864e5).toLocaleDateString(undefined, { month: "long" });
    add({ keys: ["reviews"], how: HOW.reviews, title: "Grow your reviews, every job, every week", when: "Ongoing", type: "reviews",
      detail: `${mine.reviews != null ? `You have ${mine.reviews} Google reviews${mine.rating ? ` at ${mine.rating}★` : ""}` : "AI leans hardest on review count and rating"}${lrev && mine.reviews != null ? `; ${lrev.e.name} has ${lrev.p.reviews}` : ""}. Review count and rating are the clearest pattern in who AI recommends.`,
      goals: { "reviews.count": `${Math.ceil(target / 5) * 5} by ${by}`, ...(mine.rating != null && mine.rating < 4.7 ? { "reviews.rating": "4.7★ or higher" } : {}) } });
  }

  // 10. Named, but rarely first
  const fr = you.first;
  if ((yr.rate || 0) >= 0.1 && fr?.n && fr.rate < (yr.rate || 0) * 0.5 && !used.some((x) => x.g === "Anywhere in Maine"))
    add({ keys: ["press"], how: HOW.press, title: "Get into local press and “best of” lists", when: "Next month", type: "press",
      detail: `AI names you in ${share(yr)} of answers but puts you first in only ${share(fr)}. The business named first usually has outside praise: local news, awards and “best of” lists.` });
  if (trust) {
    const home = steps.find((x) => x.type === "reviews") || steps.find((x) => x.type === "press");
    if (home) { home.detail += " " + (home.type === "reviews" ? trust.short : trust.text); home.keys.push(trust.key); }
    else add({ keys: [trust.key], how: HOW.reviews, title: "Build the reputation behind “most trusted”", when: "Next month", type: "press",
      detail: trust.text });
  }

  // Only for owners measured every month (the monthly plan, or pilots you measure by hand).
  if (opts.monthly) add({ keys: ["monthly"], title: "Re-measure every month", when: "Monthly", type: "other",
    how: ["Nothing to do: it runs on its own.", "When the email arrives, open your dashboard and look at what changed."],
    detail: `On the 1st we ask the same ${s.questions.length} questions again, from the same towns, and show you what changed. Each finished step is marked on your chart.` });
  return steps.sort((a, b) => WHEN_ORDER.indexOf(a.when) - WHEN_ORDER.indexOf(b.when));
}

/* ---------- Client detail ---------- */
async function renderClient(id) {
  const { clients } = await api("/api/clients");
  const c = clients.find((x) => x.id === id);
  if (!c) throw new Error("Client not found.");
  const [{ audits }, rk, nt] = await Promise.all([api("/api/audits?clientId=" + encodeURIComponent(id)), api("/api/rechecks?clientId=" + encodeURIComponent(id)).catch(() => null), api("/api/notify?clientId=" + encodeURIComponent(id)).catch(() => null)]);
  const engChecks = Object.entries(CONFIG.engines).map(([eid, e]) => h("label", { class: "row", style: "font-weight:500" },
    h("input", { type: "checkbox", value: eid, checked: e.available ? true : null, disabled: e.available ? null : true, class: "eng" }), `${e.label}${e.available ? "" : " (no key)"}`));
  const runs = h("select", {}, [2, 3, 5, 10].map((n) => h("option", { value: n, selected: n === 3 ? true : null, text: `${n} runs per question` })));
  const locs = h("select", {}, [1, 2, 3, 4].map((n) => h("option", { value: n, selected: n === Math.min(3, 1 + (c.testTowns || []).length) ? true : null, text: `${n} location${n > 1 ? "s" : ""}` })));
  const est = h("p", { class: "small muted" });
  const statewide = Number(c.radius) >= 400;
  const qPerLoc = 11 + (statewide ? 2 : 0) + (c.customQuestions || []).length;
  const updateEst = () => {
    const engines = [...document.querySelectorAll(".eng:checked")].map((x) => x.value);
    const per = qPerLoc * Number(locs.value) * Number(runs.value) + 3 * Math.min(3, Number(runs.value));
    const cost = { openai: 0.058, gemini: 0.028, perplexity: 0.006, anthropic: 0.02, aimode: 0.004 };
    const dollars = engines.reduce((s, e) => s + per * (cost[e] || 0.03), 0);
    est.textContent = `${per} answers per platform, ${per * engines.length} total. Estimated cost about $${dollars.toFixed(2)} at list prices. Takes roughly 5–15 minutes.`;
  };
  [runs, locs].forEach((x) => x.addEventListener("change", updateEst));
  const err = h("p", { class: "err" });
  const start = async (ev) => {
    ev.target.disabled = true;
    try {
      const engines = [...document.querySelectorAll(".eng:checked")].map((x) => x.value);
      const r = await api("/api/audits", { method: "POST", body: JSON.stringify({ clientId: id, engines, runs: Number(runs.value), maxLocations: Number(locs.value) }) });
      location.hash = `#audit/${encodeURIComponent(r.audit.key)}`;
    } catch (e) { err.textContent = e.message; ev.target.disabled = false; }
  };
  const done = audits.filter((a) => a.rates);
  mount(
    h("div", { class: "row", style: "justify-content:space-between" },
      h("div", {}, h("h1", { text: c.business }), h("p", { class: "sub", text: `${c.trade} · ${c.town}, ${c.state} · ${areaLabel(c.radius)} · tests from ${[c.town, ...(c.testTowns || [])].join(", ")}` })),
      h("div", { class: "row" }, h("a", { class: "btn quiet", href: `#edit/${c.id}`, text: "Edit" }), h("a", { class: "btn quiet", href: "#clients", text: "All clients" }))),
    h("div", { class: "card" },
      h("h2", { text: "Run a measured audit" }),
      h("p", { class: "sub small", text: `Asks ${qPerLoc} customer questions from each location, several times, on each platform, and tracks ${c.business}${c.competitors.length ? " against " + c.competitors.map((x) => x.name).join(", ") : ""}`.replace(/\.?$/, ".") }),
      statewide ? h("p", { class: "small", style: "margin:-4px 0 12px;color:var(--muted)", text: `Statewide client: 2 of the questions ask about all of Maine (“Who’s the best ${String(c.trade || "business").toLowerCase()} in Maine?”). Pick target towns spread across the state, for example Portland, Bangor and Augusta, so the towns cover the area he serves.` }) : null,
      h("div", { class: "grid2" }, h("div", {}, engChecks), h("div", {}, h("label", { text: "Sampling" }), runs, h("div", { style: "height:8px" }), h("label", { text: "Locations" }), locs)),
      est, h("button", { class: "btn", onclick: start, text: "Start audit" }), err),
    signupCard(c, audits),
    asksCard(c),
    quickCard(c),
    dashboardCard(c, done.length > 0),
    recheckCard(c, rk, audits),
    ownerUpdatesCard(c, nt),
    townsCard(c),
    planCard(c, audits),
    done.length > 1 ? trendCard(done) : null,
    h("div", { class: "card" }, h("h2", { text: "Audits" }),
      audits.length ? audits.map((a) => {
        const you = a.rates?.find((r) => r.isClient);
        return h("div", { class: "list-item" },

            h("div", { class: "muted small", text: `${a.engines.length} platforms · ${a.runs} runs · ${a.locations.join(", ")}${a.estimatedCost ? " · est. $" + Number(a.estimatedCost).toFixed(2) : ""}` })),
          h("div", { style: "text-align:right" }, you ? h("div", {}, h("b", { text: pct(you.rate) }), h("div", { class: "small muted", text: `likely ${Math.round(you.low * 100)}–${Math.round(you.high * 100)}%` })) : h("span", { class: "pill p-info", text: a.status })));
      }) : h("p", { class: "muted", text: "No audits yet." })));

  document.querySelectorAll(".eng").forEach((x) => x.addEventListener("change", updateEst));

/* ---------- Early re-checks ---------- */
const money = (c) => (c == null ? "" : "$" + (c % 100 ? (c / 100).toFixed(2) : String(c / 100)));
const COST = { openai: 0.058, gemini: 0.028, perplexity: 0.006, anthropic: 0.02, aimode: 0.004 };

// Clients page: requests waiting for staff, and re-checks that stopped partway.
function recheckInbox(rk) {
  const open = rk?.open || [], stuck = rk?.stuck || [];
  if (!open.length && !stuck.length) return null;
  return h("div", { class: "card rk-open" },
    h("h2", { text: `Early re-checks needing you (${open.length + stuck.length})` }),
    h("p", { class: "sub small", text: rk.settings?.mode === "stripe"
      ? "Paid re-checks start on their own. These need a hand: paid ones that couldn’t start, requests, and re-checks that stopped partway. The owner’s dashboard says it’s queued until you run it."
      : "Owners ask for these from their dashboard (Stripe isn’t set up yet). Confirm with them, run it from their page, and bill them." }),
    open.map((r) => h("div", { class: "rk-row" },
      h("div", {}, h("b", { text: r.business }), " ", h("span", { class: "pill " + (r.paid ? "p-pass" : "p-info"), text: r.paid ? `paid ${money(r.amountCents)}` : "requested" }),
        h("div", { class: "small muted", text: `${r.paid ? "Paid" : "Asked"} ${dt(r.createdAt)} from their dashboard${r.error ? ` · couldn’t start: ${r.error}` : ""}` })),
      h("a", { class: "btn quiet", href: `#client/${r.clientId}`, text: "Open client" }))),
    stuck.map((r) => h("div", { class: "rk-row" },
      h("div", {}, h("b", { text: r.business }), " ", h("span", { class: "pill p-warn", text: "stalled" }),
        h("div", { class: "small muted", text: `Started ${dt(r.startedAt || r.createdAt)} · ${pct(r.progress)} of answers in` })),
      h("a", { class: "btn quiet", href: `#audit/${encodeURIComponent(r.auditKey)}`, text: "Open progress" }))));
}

// Client page: settings, what's running, open requests, history, and payments.
function recheckCard(c, rk, audits) {
  if (!rk) return null;
  const s = rk.settings, st = rk.status || {};
  const err = h("p", { class: "err small" });
  const latest = audits.find((a) => a.status === "complete" && a.kind !== "recheck");

function planCard(c, audits) {
  let plan = (c.plan || []).map((p) => ({ ...p, checks: { ...(p.checks || {}) } }));
  // What the plan looked like when this page loaded, to merge in anything the owner did meanwhile.
  let base = JSON.parse(JSON.stringify(c.plan || []));
  const wrap = h("div");
  const msg = h("span", { class: "small muted" });
  const draw = () => wrap.replaceChildren(...(plan.length ? plan.map((p, i) => h("div", { class: "plan-row" },
    h("input", { type: "text", value: p.title, placeholder: "What to do", oninput: (e) => { p.title = e.target.value; } }),
    h("select", { onchange: (e) => { p.status = e.target.value; if (p.status === "done" && !p.doneAt) p.doneAt = new Date().toISOString().slice(0, 10); draw(); } },
      [["planned", "Planned"], ["doing", "In progress"], ["done", "Done"]].map(([v, l]) => h("option", { value: v, selected: p.status === v ? true : null, text: l }))),
    p.status === "done" ? h("input", { type: "date", value: p.doneAt || "", title: "Date completed", onchange: (e) => { p.doneAt = e.target.value; } })
      : h("input", { type: "text", value: p.when || "", placeholder: "When (e.g. This month)", oninput: (e) => { p.when = e.target.value; } }),
    h("button", { class: "btn quiet", onclick: () => { plan.splice(i, 1); draw(); }, text: "Remove" }),
    h("label", { class: "small muted plan-kind" }, "Kind of work (drives the client’s simulator): ",
      h("select", { onchange: (e) => { p.type = e.target.value; draw(); } }, [["crawler","Let AI crawlers in"],["website","Website build"],["towns","Town or service pages"],["listings","Listings and directories"],["hours","Hours and details"],["accuracy","Fix wrong information"],["schema","Schema markup"],["reviews","Reviews"],["press","Press and awards"],["other","Other"]].map(([v, l]) => h("option", { value: v, selected: (p.type || "other") === v ? true : null, text: l }))),
      p.checkedByOwner ? h("span", { class: "pill p-info", style: "margin-left:8px", text: "checked off by client" }) : null),
    h("textarea", { placeholder: "Why it matters: what the audit found, in plain English", oninput: (e) => { p.detail = e.target.value; } }, p.detail || ""),
    h("textarea", { placeholder: "How to do it: one short step per line (shown to the owner as a numbered list)", style: "min-height:88px", oninput: (e) => { p.how = e.target.value.split("\n").map((x) => x.trim()).filter(Boolean); } }, (p.how || []).join("\n")),
    checksList(p, draw),
    goalsEditor(p, draw)))
    : [h("p", { class: "muted", text: "No plan items yet. Suggest them from the latest audit, or add your own." })]));
  draw();
  const latest = audits.find((a) => a.status === "complete");
  const suggest = async () => {
    if (!latest) { msg.textContent = "Run an audit first."; return; }
    const d = await api("/api/audit?key=" + encodeURIComponent(latest.key));
    const have = new Set(plan.flatMap(stepKeys));
    let n = 0, kept = 0;
    for (const st of ownerPlan(d.audit, d.summary, d.site, { monthly: !!c.tracking })) {
      if (st.keys.some((k) => have.has(k))) { kept++; continue; }
      st.keys.forEach((k) => have.add(k));
      plan.push({ title: st.title, detail: st.detail, how: st.how || [], when: st.when, type: st.type || "other", status: "planned", extra: st.extra || [], goals: st.goals || {}, keys: st.keys }); n++;
    }
    const keptTxt = kept ? ` ${kept} already in the plan ${kept === 1 ? "was" : "were"} left as ${kept === 1 ? "it was" : "they were"}. To refresh the wording and numbers of steps that haven’t been started, press Rewrite from latest audit.` : "";
    const site = !c.website && d.summary?.ownDomain ? ` AI cites ${d.summary.ownDomain.domain}. If that’s their website, add it to the business details above, save, then open the audit and click “Re-check website and listings” so the website gets scored.` : "";
    // Keep the plan in time order: this week first, monthly last.
    const rank = (p) => { const i = WHEN_ORDER.indexOf(p.when); return i < 0 ? 1 : i; };
    plan.sort((a, b) => rank(a) - rank(b));
    draw(); msg.textContent = n ? `${n} step${n === 1 ? "" : "s"} added from the audit. Read it over, edit the wording if you like, then Save plan.${keptTxt}${site}` : `Nothing new to add from this audit.${keptTxt}${site}`;
  };
  // Rewrites every step that hasn't been started with this audit's numbers and the current wording.
  // Steps in progress or done are left alone; a step you wrote yourself is kept; ticks the owner made are kept.
  const refresh = async () => {
    if (!latest) { msg.textContent = "Run an audit first."; return; }
    const d = await api("/api/audit?key=" + encodeURIComponent(latest.key));
    const fresh = ownerPlan(d.audit, d.summary, d.site, { monthly: !!c.tracking });
    const started = (p) => p.status && p.status !== "planned";
    const taken = new Set(plan.filter(started).flatMap(stepKeys));
    const next = plan.filter(started);
    let rewritten = 0, added = 0, removed = 0;
    const old = plan.filter((p) => !started(p));
    for (const st of fresh) {
      if (st.keys.some((k) => taken.has(k))) continue;                 // already under way or done
      st.keys.forEach((k) => taken.add(k));
      const was = old.find((p) => !p._used && stepKeys(p).some((k) => st.keys.includes(k)));
      if (was) { was._used = true; rewritten++; } else added++;
      next.push({ ...(was ? { id: was.id, checks: was.checks || {}, checkedByOwner: was.checkedByOwner } : {}), title: st.title, detail: st.detail, how: st.how || [], when: st.when, type: st.type || "other", status: "planned", extra: st.extra || [], goals: st.goals || {}, keys: st.keys });
    }
    // What's left of the old not-started steps: keep the ones you wrote by hand, drop stale suggestions and repeats.
    for (const p of old) { if (p._used) { delete p._used; continue; } if (stepKeys(p).every((k) => k.startsWith("title:")) && (p.title || "").trim()) next.push(p); else removed++; }
    const rank = (p) => { const i = WHEN_ORDER.indexOf(p.when); return i < 0 ? 1 : i; };
    plan = next.sort((a, b) => rank(a) - rank(b));
    draw();
    msg.textContent = `${rewritten} step${rewritten === 1 ? "" : "s"} rewritten, ${added} added, ${removed} old or repeated step${removed === 1 ? "" : "s"} removed. Steps in progress or done weren’t touched. Read it over, then Save plan.`;
  };
  // The owner can tick steps and benchmarks on their dashboard while this page is open. Before
  // saving, take the latest client record and keep the owner's changes that staff didn't touch here.
  const merged = (fresh) => plan.map((p) => {
    const was = base.find((x) => x.id === p.id), now = (fresh.plan || []).find((x) => x.id === p.id);
    if (!was || !now) return p;
    const out = { ...p, checks: { ...(p.checks || {}) } };
    for (const [k, v] of Object.entries(now.checks || {})) if (!(was.checks || {})[k] && !out.checks[k]) out.checks[k] = v;     // ticked by the owner
    for (const k of Object.keys(was.checks || {})) if (!(now.checks || {})[k] && (p.checks || {})[k] && !p.checks[k].confirmed && JSON.stringify(p.checks[k]) === JSON.stringify(was.checks[k])) delete out.checks[k]; // unticked by the owner
    if (p.status === was.status && now.status !== was.status) Object.assign(out, { status: now.status, doneAt: now.doneAt, checkedByOwner: now.checkedByOwner });
    return out;
  });
  const save = async () => {
    const { clients } = await api("/api/clients");
    const fresh = clients.find((x) => x.id === c.id) || c;
    const r = await api("/api/clients", { method: "POST", body: JSON.stringify({ client: { ...fresh, plan: merged(fresh) } }) });
    Object.assign(c, r.client); base = JSON.parse(JSON.stringify(r.client.plan || []));
    plan = r.client.plan.map((p) => ({ ...p, checks: { ...(p.checks || {}) } })); draw(); msg.textContent = "Saved. Your client’s dashboard shows the update.";
  };
  return h("div", { class: "card" },
    h("h2", { text: "Plan your client sees" }),
    h("p", { class: "sub small", text: "What the owner sees under Your plan. They tick steps off themselves, and finished steps show as markers on their chart. Suggest adds steps the plan doesn’t have yet; Rewrite also refreshes the wording and numbers of every step that hasn’t been started." }),
    wrap,
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "btn quiet", onclick: () => { plan.push({ title: "", detail: "", when: "", status: "planned" }); draw(); }, text: "Add item" }),
      h("button", { class: "btn quiet", onclick: suggest, text: "Suggest from latest audit" }),
      h("button", { class: "btn quiet", onclick: refresh, text: "Rewrite from latest audit" }),

}

function trendCard(done) {
  const pts = done.slice().reverse().map((a) => ({ d: a.createdAt, r: a.rates.find((x) => x.isClient) }));
  const W = 640, H = 160, P = 30;
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, pts.length - 1);
  const y = (v) => H - P - v * (H - 2 * P);
  const band = pts.map((p, i) => `${x(i)},${y(p.r.high)}`).join(" ") + " " + pts.slice().reverse().map((p, i) => `${x(pts.length - 1 - i)},${y(p.r.low)}`).join(" ");
  const line = pts.map((p, i) => `${x(i)},${y(p.r.rate)}`).join(" ");
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mention rate over time">
    ${[0, 0.25, 0.5, 0.75, 1].map((v) => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#DCE1EA"/><text x="4" y="${y(v) + 4}" font-size="10" fill="#8692A8">${v * 100}%</text>`).join("")}
    <polygon points="${band}" fill="#E8F0FF"/><polyline points="${line}" fill="none" stroke="#014FE5" stroke-width="2.5"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.r.rate)}" r="4" fill="#014FE5"/><text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#56627A">${new Date(p.d).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>`).join("")}
  </svg>`;
  return h("div", { class: "card" }, h("h2", { text: "Mention rate over time" }), h("p", { class: "sub small", text: "Line: measured rate. Shaded: likely range." }), h("div", { html: svg, style: "max-width:760px" }));
}

/* ---------- Audit view ---------- */
// After a new platform key (say, Google AI Mode) or the Google Places key is added, a finished audit
// can be brought up to date: only the new parts are asked; answers already collected are kept.
const placesMissing = (progress, site) => !!CONFIG.maps && progress.site?.status === "done" && !(site?.places?.client?.found);
function updateRow(audit, progress, site, running, key) {
  if (running) return null;
  const missing = Object.entries(CONFIG.engines || {}).filter(([e, c]) => c.available && !audit.plan.engines.includes(e)).map(([e]) => e);
  const places = placesMissing(progress, site);
  if (!missing.length && !places) return null;
  const short = (e) => String(CONFIG.engines[e]?.label || e).replace(/\s*\(.*\)\s*$/, "");
  const per = audit.plan.tasksPerEngine || Object.entries(progress).find(([e]) => e !== "site")?.[1]?.total || 0;
  const dollars = missing.reduce((t, e) => t + per * (COST[e] || 0.03), 0);
  const parts = [...missing.map(short), ...(places ? ["Google ratings and reviews"] : [])];
  const list = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const what = [missing.length ? `Asks only ${list(missing.map(short))} the same ${per} questions${dollars ? ` (about $${dollars.toFixed(2)})` : ""}` : "", places ? `${missing.length ? "reads" : "Reads"} the Google listings for you and your competitors` : ""].filter(Boolean).join(" and ");
  return h("div", { class: "update-row", style: "margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)" },
    h("p", { style: "margin:0 0 6px" }, h("b", { text: "Not in this audit yet: " }), parts.join(", ")),
    h("div", { class: "row" },
      h("button", { class: "btn", onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Adding…";
        try { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "add-engines", engines: [...missing, ...(places ? ["site"] : [])] }) }); } catch (err) { alert(err.message); } route(); },
        text: `Add ${list(parts)}` }),
      h("span", { class: "small muted", text: `${what}. Answers already collected are kept, and the audit re-scores when it finishes.` })));
}
async function renderAudit(key) {
  const data = await api("/api/audit?key=" + encodeURIComponent(key));
  const { audit, progress, summary, site } = data;
  const running = audit.status !== "complete" || !!audit.updating;
  const head = h("div", { class: "row", style: "justify-content:space-between" },
    h("div", {}, h("h1", { text: `${audit.client.business}: ${audit.kind === "recheck" ? "early re-check" : "AI visibility audit"}` }),
      h("p", { class: "sub", text: `${dt(audit.createdAt)} · ${audit.plan.engines.length} platforms · ${audit.plan.runs} runs per question · tested from ${audit.plan.locations.map((l) => l.town).join(", ")}` })),
    h("div", { class: "row noprint" },
      !running ? h("button", { class: "btn", onclick: () => print(), text: "Print / save PDF" }) : null,
      !running ? h("button", { class: "btn quiet", onclick: () => downloadCsv(key), text: "Raw answers (CSV)" }) : null,
      h("a", { class: "btn quiet", href: `#client/${audit.clientId}`, text: "Back" })));
  const prog = h("div", { class: "card noprint" }, h("h2", { text: audit.updating ? "Updating this audit" : running ? "Collecting answers" : "Collection finished" }),
    audit.updating ? h("p", { class: "small muted", text: "The owner’s dashboard keeps showing the earlier results until every part below finishes, then switches to the updated ones." }) : null,
    Object.entries(progress).map(([e, p]) => h("div", { style: "margin:10px 0" },
      h("div", { class: "row", style: "justify-content:space-between" }, h("b", { text: e === "site" ? "Website and listings check" : CONFIG.engines[e]?.label || e }),
        h("span", { class: "small muted", text: `${p.status}${p.total ? ` · ${p.done}/${p.total}` : ""}${p.errors ? ` · ${p.errors} errors` : ""}` })),
      h("div", { class: "prog" }, h("i", { style: `width:${p.total ? Math.round((100 * p.done) / p.total) : p.status === "done" ? 100 : 0}%` })),
      p.fatal ? h("p", { class: "err small", text: p.fatal }) : p.lastError && p.status !== "done" ? h("p", { class: "small muted", text: "Last error: " + p.lastError }) : null,
      // A platform that failed, stalled, or finished with unanswered questions can be retried on its own.
      e !== "site" && (p.status === "failed" || p.status === "stalled" || (p.status === "done" && p.errors && p.done < p.total))
        ? h("div", { class: "row", style: "margin-top:6px" },
            h("button", { class: "btn quiet tiny", onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Retrying…"; try { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "resume", engines: [e] }) }); } catch (err) { alert(err.message); } route(); }, text: `Retry ${CONFIG.engines[e]?.label || e}` }),
            h("span", { class: "small muted", text: `Asks only its ${p.total - p.done} unanswered questions. Other platforms are kept.` }),
            // If it keeps failing, finish the audit without it so the owner's dashboard isn't held up.
            (p.status === "failed" || p.status === "stalled") && audit.plan.engines.length > 1
              ? h("div", { class: "row", style: "margin-top:4px;width:100%" },
                  h("button", { class: "btn quiet tiny", onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Finishing…"; try { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "drop-engines", engines: [e] }) }); } catch (err) { alert(err.message); } route(); }, text: `Finish without ${String(CONFIG.engines[e]?.label || e).replace(/\s*\(.*\)\s*$/, "")}` }),
                  h("span", { class: "small muted", text: "Scores the audit from the other platforms now. You can add it back later with the Add button." }))
              : null)
        : e === "site" && !running && p.status === "done" && !placesMissing(progress, site)
        ? h("div", { class: "row", style: "margin-top:6px" },
            h("button", { class: "btn quiet tiny", onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Re-checking…"; try { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "resume", engines: ["site"] }) }); } catch (err) { alert(err.message); } route(); }, text: "Re-check website and listings" }),
            h("span", { class: "small muted", text: "Reads the website and Google listings again, using the website and phone now on the client page, then re-scores. AI answers are kept." }))
        : null)),
    updateRow(audit, progress, site, running, key),
    Object.values(progress).some((p) => p.status === "stalled" || p.status === "failed") ? h("button", { class: "btn quiet", onclick: async () => { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "resume" }) }); route(); }, text: "Resume stalled platforms" }) : null);
  const nodes = [head, prog];
  if (summary) nodes.push(...report(audit, summary, site));
  if (!running) nodes.push(h("div", { class: "card noprint" }, h("div", { class: "row" },
    h("button", { class: "btn quiet", onclick: async () => { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "rescore" }) }); route(); }, text: "Re-score" }),
    h("span", { class: "small muted", text: "Re-reads every answer with the latest rules and the phone now on the client page. Nothing is asked again." }),
    h("button", { class: "btn danger", onclick: async () => { if (confirm("Delete this audit and its answers?")) { await api("/api/audit", { method: "POST", body: JSON.stringify({ key, action: "delete" }) }); location.hash = `#client/${audit.clientId}`; } }, text: "Delete audit" }))));
  mount(nodes);
  if (running) pollTimer = setTimeout(route, 6000);
}

function report(audit, s, site) {
  const ents = s.entities;
  const you = ents.find((e) => e.isClient);
  const places = site?.places || {};
  const card = (title, sub, ...kids) => h("div", { class: "card report-section" }, h("h2", { text: title }), sub ? h("p", { class: "sub small", text: sub }) : null, ...kids);
  const engines = audit.plan.engines;
  const label = (e) => CONFIG.engines[e]?.label || e;

  const scoreboard = card("AI Mention Rate", `How often each business is named across ${s.totals.discovery} answers to customer questions (questions that use a business’s name are excluded). The range is a 95% confidence interval.`,
    h("div", { class: "score" }, ents.map((e) => {
      const p = places[e.id] || {};
      return h("div", { class: "sc" + (e.isClient ? " you" : "") },
        h("div", { class: "lab", text: e.isClient ? "YOUR CLIENT" : "COMPETITOR" }), h("div", { style: "font-weight:800;color:var(--ink)", text: e.name }),
        h("div", { class: "big", text: pct(e.overall.rate) }), h("div", { class: "ci", text: range(e.overall) }),
        h("dl", {}, h("dt", { text: "Named first" }), h("dd", { text: pct(e.first.rate) }),
          h("dt", { text: "Google rating" }), h("dd", { text: p.found ? `${p.rating ?? "–"} (${p.reviews ?? 0} reviews)` : p.skipped ? "not checked" : "not found" })));
    })));

  const byEngine = card("By platform", "Each platform reads different sources, so results differ.",
    h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: "Platform" }), ents.map((e) => h("th", { class: "num", text: e.name })))),
      h("tbody", {}, engines.map((eng) => h("tr", {}, h("td", { text: label(eng) }), ents.map((e) => { const o = e.byEngine[eng]; return h("td", { class: "num" }, h("span", { class: "heat", style: `background:${heatColor(o?.rate)}`, text: pct(o?.rate) })); }))))));

  const groups = [...new Set(s.questions.map((q) => q.group))];
  const byQuestion = card("Question by question", `Share of answers naming each business, across ${audit.plan.locations.length} location(s) and ${audit.plan.runs} runs.`,
    h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: "What a customer asks" }), ents.map((e) => h("th", { class: "num", text: e.name })))),
      h("tbody", {}, groups.map((g) => [h("tr", {}, h("td", { colspan: ents.length + 1, style: "font-weight:700;color:var(--blue);padding-top:14px", text: g })),
        s.questions.filter((q) => q.group === g).map((q) => h("tr", {}, h("td", { style: "font-family:var(--serif)", text: q.text }), ents.map((e) => { const o = e.byQuestion[q.id]; return h("td", { class: "num" }, h("span", { class: "heat", style: `background:${heatColor(o?.rate)}`, text: pct(o?.rate) })); })))]))));

  const byLoc = audit.plan.locations.length > 1 ? card("By location", "The same questions asked as if the customer were in each town.",
    h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: "Customer location" }), ents.map((e) => h("th", { class: "num", text: e.name })))),
      h("tbody", {}, s.locations.map((t) => h("tr", {}, h("td", { text: t }), ents.map((e) => { const o = e.byLocation[t]; return h("td", { class: "num" }, h("span", { class: "heat", style: `background:${heatColor(o?.rate)}`, text: pct(o?.rate) })); })))))) : null;

  const max = Math.max(1, ...s.sources.map((x) => x.count));
  const sources = card("Where AI gets its information", `The sites cited most often in these answers. Being listed accurately on these is the most direct way to be named.${site?.domain ? ` Your client’s own site was cited in ${s.clientDomainCited || 0} answers.` : ""}`,
    h("table", {}, h("tbody", {}, s.sources.slice(0, 15).map((x) => h("tr", {}, h("td", { style: "width:34%;font-weight:600" + (site?.domain && x.domain.includes(site.domain) ? ";color:var(--blue)" : ""), text: x.domain }),
      h("td", {}, h("div", { class: "bar" }, h("i", { style: `width:${(100 * x.count) / max}%` }))), h("td", { class: "num", style: "width:110px", text: `${pct(x.share)} of answers` }))))));

  const tracked = new Set(ents.map((e) => e.name.toLowerCase()));
  const track = async (ev, name) => {
    ev.target.disabled = true;
    try {
      const { clients } = await api("/api/clients");
      const c = clients.find((x) => x.id === audit.clientId);
      if (!c) throw new Error("Client not found.");
      if (c.competitors.length >= 5) throw new Error("Up to 5 competitors can be tracked.");
      c.competitors.push({ name, town: "", aliases: [] });
      await api("/api/clients", { method: "POST", body: JSON.stringify({ client: c }) });
      ev.target.textContent = "Added to next audit";
    } catch (e) { alert(e.message); ev.target.disabled = false; }
  };
  const others = card("Who AI names instead", "Other businesses that appear in these answers (detected automatically from list-style answers and map results). Track one to measure it head-to-head from the next audit on.",
    s.others.length ? h("table", {}, h("tbody", {}, s.others.slice(0, 12).map((o) => h("tr", {}, h("td", { style: "font-weight:600", text: o.name }), h("td", { class: "num", text: `${pct(o.share)} of answers` }),
      h("td", { class: "num noprint", style: "width:170px" }, tracked.has(o.name.toLowerCase()) ? null : h("button", { class: "btn quiet", style: "padding:4px 10px;font-size:.84rem", onclick: (e) => track(e, o.name), text: "Track as competitor" })))))) : h("p", { class: "muted", text: "None detected." }));

  const findings = site?.findings || [];
  const siteCard = card("Website and AI crawler check", site?.url ? `Checked ${site.url}` : site?.skipped || site?.error || "",
    findings.map((f) => h("div", { style: "margin:8px 0" }, h("span", { class: "pill p-" + (f.level === "info" ? "info" : f.level), text: f.level === "pass" ? "Good" : f.level === "warn" ? "Improve" : f.level === "fail" ? "Fix" : "Note" }), " ", h("b", { text: f.title }), f.detail ? h("div", { class: "small muted", style: "margin-left:4px", text: f.detail }) : null)),
    site?.robots ? h("details", { style: "margin-top:10px" }, h("summary", { text: "robots.txt rules by AI crawler" }),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: "Crawler" }), h("th", { text: "Used for" }), h("th", { text: "Allowed" }), h("th", { text: "Rule" }))),
        h("tbody", {}, site.robots.map((r) => h("tr", {}, h("td", { text: r.token }), h("td", { text: r.who }), h("td", {}, h("span", { class: "pill " + (r.allowed ? "p-pass" : r.role === "training" ? "p-info" : "p-fail"), text: r.allowed ? "yes" : "no" })), h("td", { class: "small", text: r.rule })))))) : null);

  const facts = audit.client.facts || {};
  const listRows = ents.map((e) => ({ e, p: places[e.id] || {} }));

  const cp = places.client || {};
  const issues = [];
  if (cp.found && facts.phone && digits(cp.phone) && digits(cp.phone) !== digits(facts.phone)) issues.push(`Google lists ${cp.phone}, but the verified phone is ${facts.phone}.`);
  if (cp.found && audit.client.website && cp.website && !cp.website.toLowerCase().includes(audit.client.website.replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0].toLowerCase())) issues.push(`Google lists the website as ${cp.website}.`);
  if (cp.found === false) issues.push("No Google Business Profile was found for this business.");
  const listings = card("Google listings", "From Google’s own business data (Places API).",
    h("table", {}, h("thead", {}, h("tr", {}, h("th", { text: "Business" }), h("th", { class: "num", text: "Rating" }), h("th", { class: "num", text: "Reviews" }), h("th", { text: "Phone" }), h("th", { text: "Hours" }))),
      h("tbody", {}, listRows.map(({ e, p }) => h("tr", {}, h("td", { style: "font-weight:600", text: e.name }), h("td", { class: "num", text: p.rating ?? "–" }), h("td", { class: "num", text: p.reviews ?? "–" }), h("td", { text: p.phone || (p.skipped ? "not checked" : "–") }), h("td", { class: "small", text: (p.hours || []).join("; ") || "–" }))))),
    issues.length ? h("div", { style: "margin-top:10px" }, issues.map((t) => h("p", {}, h("span", { class: "pill p-fail", text: "Fix" }), " ", t))) : null,
    // A Google Places error (key not enabled for Places API (New), billing not linked, a restriction) shows here.
    cp.error ? h("p", { class: "err small", text: "Google Places didn’t answer: " + String(cp.error).slice(0, 300) }) : null);

  const acc = s.accuracy;
  const accuracy = card("What AI says about your client by name", `Answers to questions that name ${you.name} directly. Named in ${pct(acc.brandedNamed.rate)} of ${acc.brandedNamed.n} answers.`,
    acc.phoneIssues.length ? h("p", {}, h("span", { class: "pill p-fail", text: "Wrong phone" }), ` ${acc.phoneIssues.length} answer(s) gave a phone number other than ${String(acc.factsPhone).replace(/(\d{3})(\d{3})(\d{4})/, "($1) $2-$3")}.`) : acc.factsPhone ? h("p", {}, h("span", { class: "pill p-pass", text: "Good" }), " No answers gave a wrong phone number.") : null,
    acc.samples.slice(0, 6).map((x) => h("div", {}, h("div", { class: "small muted", text: `${label(x.engine)} · “${x.question}”` }), h("div", { class: "excerpt", text: x.excerpt || "(empty answer)" }))));

  const method = card("How this was measured", null,
    h("p", { class: "note", text: `${s.totals.answers} answers collected through each platform’s official API with web search on (${engines.map(label).join(", ")}), ${audit.plan.runs} runs per question from ${audit.plan.locations.map((l) => l.town).join(", ")}. ${s.totals.errors} requests failed and are excluded. A business counts as named when its name, or a listed variation, appears in the answer or its map results. API answers closely track, but are not identical to, what customers see in each app. AI answers vary from run to run, which is why rates are shown with likely ranges.` }),
    h("p", { class: "small muted", text: `Models: ${Object.entries(audit.plan.models).map(([k, v]) => `${k} ${v}`).join(" · ")}. Estimated cost $${Number(audit.plan.estimatedCost).toFixed(2)}.` }));

  return [scoreboard, byEngine, byQuestion, byLoc, sources, others, siteCard, listings, accuracy, method];
}

async function downloadCsv(key) {
  const data = await api("/api/audit?raw=1&key=" + encodeURIComponent(key));
  const ents = data.audit.entities;
  const cols = ["engine", "town", "question", "run", "branded", ...ents.map((e) => e.name), "sources", "answer"];
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = data.answers.map((a) => [a.engine, a.town, a.question, a.run, a.branded ? "yes" : "", ...ents.map((e) => a.named[e.id] ?? ""), (a.citations || []).map((c) => c.url).join(" "), a.text]);
  const csv = [cols, ...rows].map((r) => r.map(esc).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const link = h("a", { href: URL.createObjectURL(blob), download: `${data.audit.client.business} audit ${data.audit.id}.csv` });
  document.body.append(link); link.click(); link.remove();
}
