# 207 Visibility engine. Secrets (API keys, ADMIN_PASSWORD) go in the Netlify UI, never in this file.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the admin console out of search engines.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
